<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- NetCrico: a retro TV with a play button, in the app's red. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e25566"/>
      <stop offset="1" stop-color="#a8323f"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2f38"/>
      <stop offset="1" stop-color="#0f1216"/>
    </linearGradient>
  </defs>
  <!-- antennas -->
  <path d="M64 30 L44 10 M64 30 L84 10" stroke="#d1495b" stroke-width="5" stroke-linecap="round" fill="none"/>
  <circle cx="44" cy="10" r="4.5" fill="#edae49"/>
  <circle cx="84" cy="10" r="4.5" fill="#edae49"/>
  <!-- body -->
  <rect x="8" y="28" width="112" height="80" rx="16" fill="url(#body)"/>
  <!-- screen -->
  <rect x="18" y="38" width="76" height="60" rx="10" fill="url(#screen)"/>
  <path d="M48 54 L48 82 L71 68 Z" fill="#edae49"/>
  <!-- knobs -->
  <circle cx="107" cy="52" r="6" fill="#0f1216" opacity="0.85"/>
  <circle cx="107" cy="72" r="6" fill="#0f1216" opacity="0.85"/>
  <!-- feet -->
  <rect x="26" y="106" width="14" height="10" rx="3" fill="#7d2530"/>
  <rect x="88" y="106" width="14" height="10" rx="3" fill="#7d2530"/>
</svg>
